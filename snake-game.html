<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }

        .game-container {
            text-align: center;
        }

        h1 {
            color: #00ff88;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
            letter-spacing: 5px;
        }

        .score-board {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 15px;
        }

        .score-item {
            color: #fff;
            font-size: 1.2em;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 20px;
            border-radius: 25px;
            backdrop-filter: blur(5px);
        }

        .score-item span {
            color: #00ff88;
            font-weight: bold;
            font-size: 1.3em;
        }

        canvas {
            border: 3px solid #00ff88;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3),
                        inset 0 0 30px rgba(0, 0, 0, 0.3);
            background: #1a1a2e;
        }

        .controls-info {
            margin-top: 15px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9em;
        }

        .controls-info kbd {
            background: rgba(255, 255, 255, 0.15);
            padding: 3px 10px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 0.95em;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 10px;
            z-index: 10;
        }

        .overlay h2 {
            color: #ff4757;
            font-size: 2.5em;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(255, 71, 87, 0.5);
        }

        .overlay p {
            color: #fff;
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        .overlay button {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #1a1a2e;
            border: none;
            padding: 12px 40px;
            font-size: 1.1em;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            letter-spacing: 2px;
        }

        .overlay button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.5);
        }

        .start-overlay {
            position: relative;
        }

        .start-overlay h2 {
            color: #00ff88 !important;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5) !important;
        }

        .canvas-wrapper {
            position: relative;
            display: inline-block;
        }

        /* 移动端方向键 */
        .mobile-controls {
            display: none;
            margin-top: 20px;
            user-select: none;
        }

        .mobile-controls .row {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin: 5px 0;
        }

        .mobile-controls .btn {
            width: 65px;
            height: 65px;
            background: rgba(0, 255, 136, 0.2);
            border: 2px solid rgba(0, 255, 136, 0.4);
            border-radius: 12px;
            color: #00ff88;
            font-size: 1.8em;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.15s;
            -webkit-tap-highlight-color: transparent;
        }

        .mobile-controls .btn:active {
            background: rgba(0, 255, 136, 0.5);
            transform: scale(0.95);
        }

        .mobile-controls .btn.hidden {
            visibility: hidden;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.6em; }
            .score-board { gap: 15px; }
            .score-item { font-size: 1em; padding: 6px 12px; }
            .controls-info { display: none; }
            .mobile-controls { display: block; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .new-high {
            animation: pulse 0.5s ease-in-out infinite;
            color: #ffd700 !important;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 贪吃蛇</h1>
        <div class="score-board">
            <div class="score-item">分数: <span id="score">0</span></div>
            <div class="score-item">最高分: <span id="highScore">0</span></div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>

            <!-- 开始界面 -->
            <div class="overlay start-overlay" id="startOverlay">
                <h2>🐍 贪吃蛇</h2>
                <p style="color: rgba(255,255,255,0.7);">经典街机游戏</p>
                <button onclick="startGame()">开始游戏</button>
            </div>

            <!-- 结束界面 -->
            <div class="overlay" id="gameOverOverlay" style="display: none;">
                <h2>游戏结束</h2>
                <p>你的分数: <span id="finalScore">0</span></p>
                <button onclick="startGame()">再来一局</button>
            </div>
        </div>

        <div class="controls-info">
            方向键 <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 控制方向，<kbd>P</kbd> 暂停
        </div>

        <!-- 移动端控制按钮 -->
        <div class="mobile-controls" id="mobileControls">
            <div class="row">
                <div class="btn hidden"></div>
                <div class="btn" ontouchstart="setDir(0,-1)" onclick="setDir(0,-1)">▲</div>
                <div class="btn hidden"></div>
            </div>
            <div class="row">
                <div class="btn" ontouchstart="setDir(-1,0)" onclick="setDir(-1,0)">◀</div>
                <div class="btn" ontouchstart="togglePause()" onclick="togglePause()">⏸</div>
                <div class="btn" ontouchstart="setDir(1,0)" onclick="setDir(1,0)">▶</div>
            </div>
            <div class="row">
                <div class="btn hidden"></div>
                <div class="btn" ontouchstart="setDir(0,1)" onclick="setDir(0,1)">▼</div>
                <div class="btn hidden"></div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ---- 响应式调整画布大小 ----
        function resizeCanvas() {
            const maxWidth = Math.min(400, window.innerWidth - 30);
            const size = Math.floor(maxWidth / 20) * 20;
            if (size >= 200 && size <= 400) {
                canvas.width = size;
                canvas.height = size;
                if (gridSize === 20) {
                    gridSize = Math.floor(size / 20);
                }
            }
        }

        let cols, rows;
        let gridSize = 20;
        let snake, food, direction, nextDirection;
        let score, highScore, gameSpeed;
        let gameLoop, isRunning, isPaused, isGameOver;

        // 初始化
        function init() {
            const cw = canvas.width;
            const ch = canvas.height;
            cols = Math.floor(cw / gridSize);
            rows = Math.floor(ch / gridSize);
            resizeCanvas();
            cols = Math.floor(canvas.width / gridSize);
            rows = Math.floor(canvas.height / gridSize);
            highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
            document.getElementById('highScore').textContent = highScore;
        }

        // 开始游戏
        function startGame() {
            clearInterval(gameLoop);
            document.getElementById('startOverlay').style.display = 'none';
            document.getElementById('gameOverOverlay').style.display = 'none';

            // 重置游戏状态
            const startX = Math.floor(cols / 2);
            const startY = Math.floor(rows / 2);
            snake = [
                { x: startX, y: startY },
                { x: startX - 1, y: startY },
                { x: startX - 2, y: startY }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            gameSpeed = 130;
            isRunning = true;
            isPaused = false;
            isGameOver = false;

            document.getElementById('score').textContent = 0;
            document.getElementById('score').classList.remove('new-high');

            spawnFood();
            draw();
            gameLoop = setInterval(update, gameSpeed);
        }

        // 生成食物
        function spawnFood() {
            let valid = false;
            while (!valid) {
                food = {
                    x: Math.floor(Math.random() * cols),
                    y: Math.floor(Math.random() * rows)
                };
                valid = !snake.some(s => s.x === food.x && s.y === food.y);
            }
        }

        // 游戏更新
        function update() {
            if (isPaused || !isRunning) return;

            // 应用下一个方向
            direction = { ...nextDirection };

            // 计算新头部位置
            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            // 撞墙检测
            if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) {
                gameOver();
                return;
            }

            // 撞自己检测
            if (snake.some(s => s.x === head.x && s.y === head.y)) {
                gameOver();
                return;
            }

            // 移动蛇头
            snake.unshift(head);

            // 吃到食物
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = score;
                spawnFood();
                // 每吃5个食物加速一次
                if (score % 50 === 0 && gameSpeed > 60) {
                    gameSpeed -= 8;
                    clearInterval(gameLoop);
                    gameLoop = setInterval(update, gameSpeed);
                }
            } else {
                snake.pop();
            }

            draw();
        }

        // 绘制
        function draw() {
            // 背景
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 网格线
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 0.5;
            for (let i = 1; i < cols; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
            }
            for (let j = 1; j < rows; j++) {
                ctx.beginPath();
                ctx.moveTo(0, j * gridSize);
                ctx.lineTo(canvas.width, j * gridSize);
                ctx.stroke();
            }

            // 绘制食物（带发光效果）
            const fx = food.x * gridSize + gridSize / 2;
            const fy = food.y * gridSize + gridSize / 2;
            const glowRadius = gridSize * 1.5;

            // 光晕
            const gradient = ctx.createRadialGradient(fx, fy, 0, fx, fy, glowRadius);
            gradient.addColorStop(0, 'rgba(255, 71, 87, 0.4)');
            gradient.addColorStop(1, 'rgba(255, 71, 87, 0)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(fx, fy, glowRadius, 0, Math.PI * 2);
            ctx.fill();

            // 食物本体
            ctx.fillStyle = '#ff4757';
            ctx.shadowColor = '#ff4757';
            ctx.shadowBlur = 10;
            roundRect(ctx, food.x * gridSize + 2, food.y * gridSize + 2, gridSize - 4, gridSize - 4, 5);
            ctx.fill();
            ctx.shadowBlur = 0;

            // 食物高光
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath();
            ctx.arc(fx - 2, fy - 2, 3, 0, Math.PI * 2);
            ctx.fill();

            // 绘制蛇
            snake.forEach((segment, index) => {
                const ratio = 1 - (index / snake.length) * 0.5;
                const r = Math.round(0 * ratio);
                const g = Math.round(255 * ratio);
                const b = Math.round(136 * ratio);

                // 蛇身发光
                if (index === 0) {
                    ctx.shadowColor = '#00ff88';
                    ctx.shadowBlur = 12;
                } else {
                    ctx.shadowBlur = 0;
                }

                ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                roundRect(ctx, segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2, 5);
                ctx.fill();

                // 蛇头眼睛
                if (index === 0) {
                    ctx.shadowBlur = 0;
                    const eyeSize = 3;
                    let eye1X, eye1Y, eye2X, eye2Y;
                    const cx = segment.x * gridSize + gridSize / 2;
                    const cy = segment.y * gridSize + gridSize / 2;

                    if (direction.x === 1) {
                        eye1X = cx + 4; eye1Y = cy - 4;
                        eye2X = cx + 4; eye2Y = cy + 4;
                    } else if (direction.x === -1) {
                        eye1X = cx - 4; eye1Y = cy - 4;
                        eye2X = cx - 4; eye2Y = cy + 4;
                    } else if (direction.y === -1) {
                        eye1X = cx - 4; eye1Y = cy - 4;
                        eye2X = cx + 4; eye2Y = cy - 4;
                    } else {
                        eye1X = cx - 4; eye1Y = cy + 4;
                        eye2X = cx + 4; eye2Y = cy + 4;
                    }

                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(eye1X, eye1Y, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(eye2X, eye2Y, eyeSize, 0, Math.PI * 2);
                    ctx.fill();

                    // 瞳孔
                    ctx.fillStyle = '#1a1a2e';
                    ctx.beginPath();
                    ctx.arc(eye1X + direction.x, eye1Y + direction.y, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(eye2X + direction.x, eye2Y + direction.y, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            ctx.shadowBlur = 0;

            // 暂停提示
            if (isPaused) {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#00ff88';
                ctx.font = 'bold 30px "Microsoft YaHei"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('⏸ 已暂停', canvas.width / 2, canvas.height / 2);
                ctx.font = '16px "Microsoft YaHei"';
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.fillText('按 P 继续', canvas.width / 2, canvas.height / 2 + 40);
            }
        }

        // 圆角矩形辅助
        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        // 游戏结束
        function gameOver() {
            isRunning = false;
            isGameOver = true;
            clearInterval(gameLoop);

            // 检查是否打破记录
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                document.getElementById('highScore').textContent = highScore;
                document.getElementById('highScore').classList.add('new-high');
            }

            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverOverlay').style.display = 'flex';

            // 死亡闪烁效果
            drawDeathEffect();
        }

        function drawDeathEffect() {
            let flashes = 0;
            const flashInterval = setInterval(() => {
                ctx.fillStyle = flashes % 2 === 0 ? 'rgba(255,0,0,0.3)' : 'rgba(0,0,0,0)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                flashes++;
                if (flashes > 5) clearInterval(flashInterval);
            }, 100);
        }

        // 暂停
        function togglePause() {
            if (!isRunning || isGameOver) return;
            isPaused = !isPaused;
            draw();
        }

        // 设置方向
        function setDir(x, y) {
            // 不能直接反向
            if (direction.x === -x && direction.y === -y) return;
            if (x !== 0 && direction.x === x) return;
            if (y !== 0 && direction.y === y) return;
            nextDirection = { x, y };
        }

        // ---- 键盘控制 ----
        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    e.preventDefault();
                    setDir(0, -1);
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    e.preventDefault();
                    setDir(0, 1);
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    e.preventDefault();
                    setDir(-1, 0);
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    e.preventDefault();
                    setDir(1, 0);
                    break;
                case 'p':
                case 'P':
                    togglePause();
                    break;
                case ' ':
                    e.preventDefault();
                    if (isGameOver || !isRunning) startGame();
                    break;
            }
        });

        // ---- 触摸滑动支持 ----
        let touchStartX, touchStartY;
        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        canvas.addEventListener('touchend', (e) => {
            if (!touchStartX || !touchStartY) return;
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;

            if (Math.abs(dx) > Math.abs(dy)) {
                setDir(dx > 0 ? 1 : -1, 0);
            } else {
                setDir(0, dy > 0 ? 1 : -1);
            }
            touchStartX = null;
            touchStartY = null;
        }, { passive: true });

        // 窗口大小变化时重绘
        window.addEventListener('resize', () => {
            if (!isRunning) draw();
        });

        // 页面加载后初始化
        init();
    </script>
</body>
</html>
